<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">dsh-hud</title>
  <desc id="desc">A minimal DeepSeek Harness session HUD showing DeepSeek V4 Pro, context pressure, steps, and token telemetry.</desc>

  <defs>
    <linearGradient id="background" x1="110" y1="20" x2="1090" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="0.52" stop-color="#080C16"/>
      <stop offset="1" stop-color="#0D0B19"/>
    </linearGradient>
    <radialGradient id="auroraBlue" cx="0" cy="0" r="1" gradientTransform="translate(418 286) rotate(12) scale(410 230)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3578FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3578FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraViolet" cx="0" cy="0" r="1" gradientTransform="translate(805 288) rotate(168) scale(430 235)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8B5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="241" y1="0" x2="964" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4B91FF"/>
      <stop offset="0.52" stop-color="#796CFF"/>
      <stop offset="1" stop-color="#B45CFF"/>
    </linearGradient>
    <linearGradient id="panel" x1="205" y1="217" x2="994" y2="326" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151C2C" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#101522" stop-opacity="0.97"/>
    </linearGradient>
    <filter id="panelShadow" x="-15%" y="-50%" width="130%" height="220%">
      <feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#00040D" flood-opacity="0.72"/>
    </filter>
    <filter id="liveGlow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="microgrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#A7B7DC" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" rx="32" fill="url(#background)"/>
  <rect width="1200" height="520" rx="32" fill="url(#microgrid)"/>
  <rect width="1200" height="520" rx="32" fill="url(#auroraBlue)"/>
  <rect width="1200" height="520" rx="32" fill="url(#auroraViolet)"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- Wordmark -->
    <g transform="translate(518 49)">
      <rect width="32" height="32" rx="10" fill="#141E33" stroke="#2E4267"/>
      <circle cx="16" cy="16" r="7" fill="none" stroke="url(#accent)" stroke-width="2"/>
      <circle cx="16" cy="16" r="2.7" fill="#70A2FF"/>
      <path d="M16 5v3M27 16h-3M16 27v-3M5 16h3" stroke="#6F83A9" stroke-width="1.2" stroke-linecap="round"/>
      <text x="45" y="23" fill="#EEF3FF" font-size="20" font-weight="720" letter-spacing="0.2">dsh-hud</text>
    </g>

    <!-- Hero copy -->
    <text x="600" y="132" fill="#F7F9FF" font-size="44" font-weight="730" text-anchor="middle" letter-spacing="-1.2">Your Agent, at a glance.</text>
    <text x="600" y="169" fill="#8D9BB5" font-size="17" font-weight="500" text-anchor="middle">Live session telemetry for DeepSeek Harness</text>

    <!-- The product: one focused HUD -->
    <g filter="url(#panelShadow)">
      <rect x="190" y="211" width="820" height="114" rx="27" fill="url(#panel)" stroke="#30405B"/>
      <rect x="191" y="212" width="818" height="112" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>

      <circle cx="229" cy="257" r="5" fill="#43E6A0" filter="url(#liveGlow)"/>
      <text x="244" y="262" fill="#74E6B2" font-size="11" font-weight="750" letter-spacing="1.1">LIVE</text>
      <path d="M291 239v36" stroke="#2E3A50"/>

      <text x="318" y="263" fill="#F3F6FC" font-size="20" font-weight="680">DeepSeek V4 Pro</text>

      <text x="622" y="249" fill="#71809B" font-size="10" font-weight="700" letter-spacing="1">CONTEXT</text>
      <text x="622" y="270" fill="#E7ECF7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">43%</text>

      <text x="765" y="249" fill="#71809B" font-size="10" font-weight="700" letter-spacing="1">STEPS</text>
      <text x="765" y="270" fill="#E7ECF7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">18</text>

      <text x="867" y="249" fill="#71809B" font-size="10" font-weight="700" letter-spacing="1">ELAPSED</text>
      <text x="867" y="270" fill="#E7ECF7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">2m 52s</text>

      <rect x="318" y="291" width="644" height="5" rx="2.5" fill="#232E43"/>
      <rect x="318" y="291" width="277" height="5" rx="2.5" fill="url(#accent)"/>
      <circle cx="595" cy="293.5" r="4.5" fill="#806DFF"/>
    </g>

    <!-- Quiet secondary telemetry -->
    <g transform="translate(287 361)">
      <g>
        <rect width="184" height="54" rx="16" fill="#101624" stroke="#25324A"/>
        <text x="18" y="23" fill="#72809A" font-size="10" font-weight="700" letter-spacing="0.8">INPUT</text>
        <text x="18" y="42" fill="#DCE4F2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">48.2k tokens</text>
      </g>
      <g transform="translate(195)">
        <rect width="184" height="54" rx="16" fill="#101624" stroke="#25324A"/>
        <text x="18" y="23" fill="#72809A" font-size="10" font-weight="700" letter-spacing="0.8">OUTPUT</text>
        <text x="18" y="42" fill="#DCE4F2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">6.8k tokens</text>
      </g>
      <g transform="translate(390)">
        <rect width="236" height="54" rx="16" fill="#101624" stroke="#25324A"/>
        <text x="18" y="23" fill="#72809A" font-size="10" font-weight="700" letter-spacing="0.8">BACKGROUND</text>
        <circle cx="21" cy="39" r="3" fill="#43E6A0"/>
        <text x="31" y="43" fill="#DCE4F2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">2 jobs · 3 agents</text>
      </g>
    </g>

    <!-- Product principles -->
    <g fill="#66758E" font-size="10" font-weight="700" letter-spacing="1.35">
      <text x="407" y="465" text-anchor="middle">NO POLLING</text>
      <circle cx="481" cy="461" r="2" fill="#3B4A63"/>
      <text x="544" y="465" text-anchor="middle">NATIVE SLOT</text>
      <circle cx="621" cy="461" r="2" fill="#3B4A63"/>
      <text x="713" y="465" text-anchor="middle">ZERO CONTEXT COST</text>
    </g>
  </g>
</svg>
